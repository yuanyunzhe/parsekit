[project]
name = "parsekit"
version = "0.2.0"
description = "A data toolkit for parsing: I/O, structures, and vocabulary utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []


[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
parsekit = ["py.typed"]
