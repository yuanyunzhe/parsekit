[project]
name = "parsekit"
version = "0.1.0"
description = "A data toolkit for dependency parsing: CoNLL‑U I/O, structures, and vocabulary utilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
