[project]
name = "parsekit"
version = "0.2.0"
description = "A data toolkit for parsing: I/O, structures, and vocabulary utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
parsekit = ["py.typed"]

[tool.ruff]
line-length = 160
target-version = "py312"
src = ["src"]
exclude = [".venv", "checkpoints", "__pycache__"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "YTT",
    "B",
    "A",
    "C4",
    "ISC",
    "ICN",
    "PIE",
    "Q",
    "RET",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "PTH",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
]
ignore = ["E501", "A001", "TCH001", "TCH003", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["npp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
